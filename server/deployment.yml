apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
spec:
  selector:
    matchLabels:
      app: dealership
  replicas: 1
  template:
    metadata:
      labels:
        app: dealership
    spec:
      containers:
        - name: dealership
          # Replace <your_sn_labs_namespace> with your SN Labs namespace
          image: us.icr.io/<your_sn_labs_namespace>/dealership:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dealership
spec:
  type: NodePort
  selector:
    app: dealership
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 31000
